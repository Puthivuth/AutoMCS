x-backend: &backend
  build:
    context: ./backend
  env_file: .env
  environment:
    POSTGRES_HOST: db
    REDIS_URL: redis://redis:6379/0
    AUTOMCS_DATA_ROOT: /data
  volumes: ["${AUTOMCS_DATA_HOST}:/data"]   # survive redeploys
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_started

services:
  db:
    image: postgres:16
    env_file: .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes: ["${AUTOMCS_PGDATA_HOST}:/var/lib/postgresql/data"]
  redis:
    image: redis:7
  backend:
    <<: *backend
    command: sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn config.wsgi -b 0.0.0.0:8000 --workers 3 --timeout 120"
    ports: ["8000:8000"]
  worker:        # Gemini + exports
    <<: *backend
    command: celery -A config worker -Q default -c 2 -l info
  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    ports: ["3000:3000"]
    environment: { BACKEND_URL: "http://backend:8000" }
    depends_on: [backend]

